<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">B M Rauf — a working notebook</title>
  <desc id="desc">Software, machine learning, and the experiments in between. Dhaka, Bangladesh.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF8F1"/><stop offset="1" stop-color="#EFE9DD"/>
    </linearGradient>
    <radialGradient id="glowA" cx="1060" cy="60" r="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4572E" stop-opacity=".18"/><stop offset="1" stop-color="#E4572E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="120" cy="460" r="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2A541" stop-opacity=".14"/><stop offset="1" stop-color="#F2A541" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="140" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/><stop offset="1" stop-color="#3A4350"/>
    </linearGradient>
    <linearGradient id="accent" x1="40" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4572E"/><stop offset="1" stop-color="#F2A541"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#0D1117" stroke-opacity=".05"/>
    </pattern>
    <style>
      .flow { stroke-dasharray: 6 10; animation: flow 2.4s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      .blink { animation: blink 1.6s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: .55; } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse, .blink { animation: none; } }
    </style>
  </defs>

  <rect width="1280" height="460" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="460" rx="20" fill="url(#glowA)"/>
  <rect width="1280" height="460" rx="20" fill="url(#glowB)"/>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="2.5" fill="#6A7380">
    <text x="56" y="70">MEBMRAUF  /  PERSONAL INDEX</text>
    <text x="1204" y="70" text-anchor="end">DHAKA, BD   ·   OPEN TO WORK</text>
  </g>
  <circle class="blink" cx="1220" cy="65" r="4.5" fill="#1FA463"/>

  <text x="50" y="236" fill="url(#name)" font-family="Georgia,'Times New Roman',serif" font-size="136" letter-spacing="-6">B M Rauf</text>
  <text x="56" y="292" fill="url(#accent)" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="36">A working notebook.</text>
  <text x="58" y="332" fill="#4B5461" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="17">Software, machine learning, and the experiments in between.</text>

  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="2.5" fill="#1F2630">
    <text x="58" y="388">FULL-STACK<tspan fill="#C2410C" dx="14">·</tspan><tspan dx="14">AI / ML</tspan><tspan fill="#C2410C" dx="14">·</tspan><tspan dx="14">SYSTEMS</tspan></text>
  </g>

  <g stroke="#B8BEC6" stroke-width="2">
    <path d="M850 312H906V256H962V200H1018V144H1130"/>
    <path d="M962 256H1074V312H1186M1018 200H1130V256H1186"/>
  </g>
  <g stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" class="flow">
    <path d="M850 312H906V256H962V200H1018V144H1130"/>
    <path d="M962 256H1074V312H1186M1018 200H1130V256H1186"/>
  </g>
  <g fill="#FBF8F1" stroke="#1F2630" stroke-width="2">
    <circle cx="850" cy="312" r="7"/><circle cx="962" cy="256" r="7"/>
    <circle cx="1018" cy="200" r="7"/><circle cx="1130" cy="144" r="7"/>
    <circle cx="1186" cy="312" r="7"/>
  </g>
  <circle class="pulse" cx="1186" cy="256" r="10" fill="#E4572E"/>
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#6A7380">
    <text x="1104" y="126">BUILD</text><text x="1136" y="291">TEST</text><text x="1138" y="346">REPEAT</text>
  </g>

  <rect x="56" y="424" width="120" height="4" rx="2" fill="url(#accent)"/>
</svg>
